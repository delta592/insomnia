name: Setup Insomnia Node
description: Node from .nvmrc plus npm version from package.json engines

inputs:
  node-version-file:
    description: Path to .nvmrc
    required: false
    default: .nvmrc
  cache-dependency-path:
    description: Path to package-lock.json for npm cache
    required: false
    default: package-lock.json
  registry-url:
    description: Optional npm registry URL
    required: false
    default: ''
  scope:
    description: Optional npm scope for the registry
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Align npm version
      shell: bash
      run: npm install -g npm@$(node -p "require('./package.json').engines.npm")

    - name: Install libcurl dev headers (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libcurl4-openssl-dev
