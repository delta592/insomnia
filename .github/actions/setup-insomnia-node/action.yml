name: Setup Insomnia Node
description: Node from .nvmrc plus npm version from package.json engines

inputs:
  node-version-file:
    description: Path to .nvmrc
    required: false
    default: .nvmrc
  cache-dependency-path:
    description: Path to package-lock.json for npm cache
    required: false
    default: package-lock.json
  registry-url:
    description: Optional npm registry URL
    required: false
    default: ''
  scope:
    description: Optional npm scope for the registry
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Align npm version
      shell: bash
      run: npm install -g npm@12.0.2
